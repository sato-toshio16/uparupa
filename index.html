<!doctype html> 
<html lang="ja"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1"> 
  <title>ウーパールーパーAR</title> 
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/gh/AR-js-
org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script> 
  <style> 
    body { margin: 0; overflow: hidden; } 
  </style> 
</head> 
<body> 
  <a-scene embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"> 
    <a-marker preset="hiro"> 

      <!-- ここから自作コード -->
      <!-- ウーパールーパー全体 -->
      <a-entity scale="0.2 0.2 0.2"
                rotation="0 0 90">

        <!-- 全体の位置調整 -->
        <a-entity position="1.05 0 0">

          <!-- 胴体 -->
          <a-entity position="-0.2 0.65 0" scale="1.35 0.35 0.65">
            <a-sphere radius="1" color="#FF9EBA"></a-sphere>
          </a-entity>

          <!-- 頭 -->
          <a-entity position="1.0 0.95 0" scale="0.8 0.55 0.7">
            <a-sphere radius="1" color="#FFB3C7"></a-sphere>
          </a-entity>

          <!-- 目（手前側） -->
          <a-sphere position="1.35 1.15 0.5"
                    radius="0.1" color="#0D0A12"></a-sphere>

          <!-- 目（反対側） -->
          <a-sphere position="1.35 1.15 -0.5"
                    radius="0.1" color="#0D0A12"></a-sphere>

          <!-- 口 -->
          <a-box position="1.75 0.9 0"
                 width="0.085" height="0.025" depth="0.4"
                 color="#BF4066"></a-box>

          <!-- 外鰓（手前側） -->
          <a-cone position="0.95 1.30 0.8"
                  rotation="63 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <a-cone position="0.95 0.95 0.85"
                  rotation="90 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <a-cone position="0.95 0.65 0.78"
                  rotation="109 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <!-- 外鰓（反対側） -->
          <a-cone position="0.95 1.30 -0.8"
                  rotation="-63 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <a-cone position="0.95 0.95 -0.85"
                  rotation="-90 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <a-cone position="0.95 0.65 -0.78"
                  rotation="-109 0 0"
                  radius-bottom="0.13" height="0.55"
                  color="#FF5987"></a-cone>

          <!-- 前足（手前） -->
          <a-cylinder position="0.65 0.3 0.55"
                      rotation="-34 0 0"
                      radius="0.12" height="0.5"
                      color="#FFA6C0"></a-cylinder>

          <!-- 前足（反対側） -->
          <a-cylinder position="0.65 0.3 -0.55"
                      rotation="34 0 0"
                      radius="0.12" height="0.5"
                      color="#FFA6C0"></a-cylinder>

          <!-- 後ろ足（手前） -->
          <a-cylinder position="-0.85 0.3 0.55"
                      rotation="-34 0 0"
                      radius="0.12" height="0.5"
                      color="#FFA6C0"></a-cylinder>

          <!-- 後ろ足（反対側） -->
          <a-cylinder position="-0.85 0.3 -0.55"
                      rotation="34 0 0"
                      radius="0.12" height="0.5"
                      color="#FFA6C0"></a-cylinder>

          <!-- しっぽ -->
          <a-entity position="-1.4 0.8 0"
                    scale="2.5 0.3 0.2">
            <a-sphere radius="1" color="#FF9EBA"></a-sphere>
          </a-entity>

        </a-entity>
      </a-entity>
      
    </a-marker> 
    <a-entity camera></a-entity> 
  </a-scene> 
</body> 
</html>
